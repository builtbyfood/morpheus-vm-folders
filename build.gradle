buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.github.johnrengelman:shadow:8.1.1"
        classpath "com.morpheusdata:morpheus-plugin-gradle:1.3.0"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:${assetPipelineVersion}"
    }
}

apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'asset-pipeline'
apply plugin: 'com.morpheusdata.morpheus-plugin-gradle'

group = 'com.morpheusdata'

java {
    sourceCompatibility = JavaVersion.toVersion('11')
    targetCompatibility = JavaVersion.toVersion('11')
}

repositories {
    mavenLocal()
    mavenCentral()
}

configurations {
    provided
}

sourceSets {
    main {
        compileClasspath += configurations.provided
    }
}

dependencies {
    provided "com.morpheusdata:morpheus-plugin-api:${morpheusApiVersion}"
    provided "com.bertramlabs.plugins:karman-core:${karmanVersion}"
    provided "org.codehaus.groovy:groovy-all:${groovyVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.slf4j:slf4j-parent:${slf4jVersion}"
    implementation 'io.reactivex.rxjava2:rxjava:2.2.0'
}

jar {
    manifest {
        attributes(
            'Plugin-Class': 'com.morpheusdata.vmfolders.VmFoldersPlugin',
            'Plugin-Version': version,
            'Morpheus-Name': 'VM Folders',
            'Morpheus-Organization': 'Travis DeLuca',
            'Morpheus-Code': 'vm-folders-plugin',
            'Morpheus-Description': 'Folder organization for VMs in HPE Morpheus VM Essentials',
            'Morpheus-Labels': 'Plugin, UI, Infrastructure',
            'Morpheus-Repo': 'https://github.com/builtbyfood/morpheus-vm-folders',
            'Morpheus-Min-Appliance-Version': '8.1.0'
        )
    }
}

assets {
    packagePlugin = false  // required for plugins
}

tasks.assemble.dependsOn tasks.shadowJar

// Build:
//   sdk use gradle 8.8 (or any 8.x)
//   export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
//   gradle shadowJar --no-daemon
// Output: build/libs/morpheus-vm-folders-plugin-{version}-all.jar
